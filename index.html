<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="90s Kids Vibe - Music Player"
    >

    <title>90s Kids Vibe</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="logo">
            🎵 90s Kids Vibe
        </div>

        <div class="searchBox">

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs or artists..."
                autocomplete="off"
            >

        </div>

    </header>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- =============================================
             PLAYLIST SIDEBAR
        ============================================== -->

        <aside class="sidebar">

            <h3>Playlists</h3>

            <button
                class="playlistBtn"
                data-playlist="All"
            >
                🎵 All Songs
            </button>

            <button
                class="playlistBtn"
                data-playlist="2000-2015 Hits"
            >
                🔥 2000–2015 Hits
            </button>

            <button
                class="playlistBtn"
                data-playlist="Favorites"
            >
                ⭐ Favorites
            </button>

        </aside>


        <!-- =============================================
             CONTENT
        ============================================== -->

        <section class="content">

            <h1 id="playlistTitle">
                2000–2015 Hits
            </h1>


            <!-- =========================================
                 YOUTUBE PLAYER
            ========================================== -->

            <div
                id="youtubeContainer"
                class="youtubeContainer"
                style="display:none;"
            >

                <div
                    id="youtubePlayer"
                    class="youtubePlayer"
                ></div>

            </div>


            <!-- =========================================
                 SONG LIST
            ========================================== -->

            <div
                id="songList"
                class="songList"
            >

                <!-- Songs are added by script.js -->

            </div>

        </section>

    </main>


    <!-- =================================================
         BOTTOM MUSIC PLAYER
    ================================================== -->

    <div class="musicPlayer">


        <!-- =============================================
             SONG INFORMATION
        ============================================== -->

        <div class="nowPlaying">

            <img
                id="playerCover"
                src="https://placehold.co/100x100"
                alt="Album cover"
            >

            <div class="nowPlayingInfo">

                <div
                    id="playerTitle"
                    class="playerTitle"
                >
                    Select a song
                </div>

                <div
                    id="playerArtist"
                    class="playerArtist"
                >
                    90s Kids Vibe
                </div>

                <div
                    id="playerType"
                    class="playerType"
                >
                    Ready
                </div>

            </div>

        </div>


        <!-- =============================================
             PLAYER CONTROLS
        ============================================== -->

        <div class="playerControls">

            <div class="buttons">

                <button
                    id="previousBtn"
                    title="Previous"
                    type="button"
                >
                    ⏮
                </button>


                <button
                    id="playBtn"
                    title="Play / Pause"
                    type="button"
                >
                    ▶
                </button>


                <button
                    id="nextBtn"
                    title="Next"
                    type="button"
                >
                    ⏭
                </button>


                <button
                    id="shuffleBtn"
                    title="Shuffle"
                    type="button"
                >
                    🔀
                </button>


                <button
                    id="repeatBtn"
                    title="Repeat"
                    type="button"
                >
                    🔁
                </button>

            </div>


            <!-- =========================================
                 PROGRESS
            ========================================== -->

            <div class="progressArea">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- =============================================
             VOLUME
        ============================================== -->

        <div class="volumeArea">

            🔊

            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

    </div>


    <!-- =================================================
         HIDDEN MP3 AUDIO PLAYER
    ================================================== -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>


    <!-- =================================================
         SCRIPT
    ================================================== -->

    <script src="script.js"></script>

</body>

</html>
