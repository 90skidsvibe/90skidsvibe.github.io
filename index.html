<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>90s Kids Vibe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding-bottom: 120px;
        }

        header {
            padding: 18px;
            background: #181818;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .player {
            background: #1c1c1c;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        #youtubePlayer {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .info {
            padding: 15px 5px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .artist {
            color: #aaa;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            border: 0;
            background: #333;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #playBtn {
            border-radius: 50%;
            width: 50px;
            height: 50px;
            padding: 0;
            font-size: 20px;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1c1c1c;
            padding: 12px;
            border-radius: 10px;
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-weight: bold;
        }

        .song-artist {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .search {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 0;
            margin-bottom: 15px;
            font-size: 16px;
        }

        @media (max-width: 600px) {

            header {
                font-size: 20px;
            }

            .container {
                padding: 12px;
            }

            .controls {
                gap: 7px;
            }

            button {
                padding: 10px 12px;
            }

        }
    </style>
</head>

<body>

<header>
    🎵 90s Kids Vibe
</header>

<div class="container">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search songs..."
    >

    <div class="player">

        <div id="youtubePlayer"></div>

        <div class="info">

            <div id="songTitle" class="title">
                Select a song
            </div>

            <div id="songArtist" class="artist">
                YouTube Music
            </div>

        </div>

        <div class="controls">

            <button id="previousBtn">
                ⏮
            </button>

            <button id="playBtn">
                ▶
            </button>

            <button id="nextBtn">
                ⏭
            </button>

            <button id="shuffleBtn">
                🔀
            </button>

        </div>

    </div>


    <h2>🎵 Music</h2>

    <div id="songList" class="song-list"></div>

</div>


<script src="script.js"></script>

</body>
</html>
