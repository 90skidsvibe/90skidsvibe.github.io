<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">

    <title>My Music</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🎵 My Music</div>

    <button id="menuBtn">☰</button>
</header>


<main>

    <!-- SEARCH -->

    <div class="searchBox">
        <input
            type="text"
            id="searchInput"
            placeholder="Search songs, artists..."
        >
    </div>


    <!-- PLAYLISTS -->

    <section>

        <h2>Playlists</h2>

        <div class="playlistContainer">

            <button class="playlistBtn" data-playlist="All">
                🎵 All Songs
            </button>

            <button class="playlistBtn" data-playlist="90s">
                📻 90s Hits
            </button>

            <button class="playlistBtn" data-playlist="Romantic">
                ❤️ Romantic
            </button>

            <button class="playlistBtn" data-playlist="Favorites">
                ⭐ Favorites
            </button>

        </div>

    </section>


    <!-- SONG LIST -->

    <section>

        <h2 id="playlistTitle">All Songs</h2>

        <div id="songList"></div>

    </section>

</main>


<!-- PLAYER -->

<div class="player">

    <div class="playerInfo">

        <img id="playerCover" src="https://placehold.co/100x100" alt="Album">

        <div>

            <h3 id="playerTitle">
                Select a song
            </h3>

            <p id="playerArtist">
                —
            </p>

        </div>

    </div>


    <!-- PROGRESS -->

    <input
        type="range"
        id="progress"
        value="0"
        min="0"
        max="100"
    >


    <div class="time">

        <span id="currentTime">0:00</span>

        <span id="duration">0:00</span>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button id="shuffleBtn">
            🔀
        </button>

        <button id="previousBtn">
            ⏮
        </button>

        <button id="playBtn" class="playButton">
            ▶
        </button>

        <button id="nextBtn">
            ⏭
        </button>

        <button id="repeatBtn">
            🔁
        </button>

    </div>


    <!-- VOLUME -->

    <div class="volume">

        🔊

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

</div>


<audio id="audio"></audio>


<script src="script.js"></script>

</body>
</html>
